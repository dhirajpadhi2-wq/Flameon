<!DOCTYPE html>
<html>
<head>
<title>Track Order - Flame On</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
}

h1{
  color:#ff3c00;
}

input{
  padding:10px;
  width:250px;
  margin:10px;
}

button{
  padding:8px 15px;
  background:#ff3c00;
  color:white;
  border:none;
  cursor:pointer;
}

.result-box{
  margin-top:20px;
  padding:15px;
  border:1px solid #444;
  display:inline-block;
  background:#1a1a1a;
}
</style>
</head>

<body>

<h1>📦 Track Your Order</h1>

<input type="text" id="orderID" placeholder="Enter Order ID">
<br>
<button onclick="trackOrder()">Track Order</button>

<div id="result"></div>

<script>
function trackOrder(){
  let id = document.getElementById("orderID").value.trim();
  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  let resultDiv = document.getElementById("result");

  let found = orders.find(order => order.id === id);

  if(found){
    resultDiv.innerHTML = `
      <div class="result-box">
        <strong>Order ID:</strong> ${found.id}<br>
        <strong>Date:</strong> ${found.date}<br>
        <strong>Total:</strong> ₹${found.total}<br>
        <strong>Status:</strong> ${found.status}
      </div>
    `;
  } else {
    resultDiv.innerHTML = `
      <div class="result-box">
        ❌ Order Not Found
      </div>
    `;
  }
}
</script>

</body>
</html>
