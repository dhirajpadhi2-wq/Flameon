<!DOCTYPE html>
<html>
<head>
<title>Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background:#111;color:white;text-align:center;font-family:Arial">

<h1>Your Cart</h1>
<div id="cartItems"></div>
<h2 id="total"></h2>

<button onclick="orderNow()" 
style="padding:10px 20px;background:#25D366;color:white;border:none;margin:10px;">
Order via WhatsApp
</button>

<button onclick="viewHistory()" 
style="padding:10px 20px;background:#ff3c00;color:white;border:none;">
View Order History
</button>

<div id="history" style="margin-top:20px;"></div>

<script>
let cart=JSON.parse(localStorage.getItem('cart'))||[];
let total=0;
let message="Hello Flame On,%0A%0AMy Order:%0A";

cart.forEach(item=>{
message+=item.name+" - ₹"+item.price+"%0A";
total+=item.price;
});

message+="%0ATotal: ₹"+total;

document.getElementById("cartItems").innerHTML=
cart.map(item=>`<p>${item.name} - ₹${item.price}</p>`).join("");

document.getElementById("total").innerText="Total: ₹"+total;

function orderNow(){

// Save order history
let history=JSON.parse(localStorage.getItem('orders'))||[];
history.push({
items:cart,
total:total,
date:new Date().toLocaleString()
});
localStorage.setItem('orders',JSON.stringify(history));

window.open("https://wa.me/919090820969?text="+message);
}

function viewHistory(){
let history=JSON.parse(localStorage.getItem('orders'))||[];
let output="<h2>Order History</h2>";

history.forEach(order=>{
output+=`<p><b>${order.date}</b><br>
Total: ₹${order.total}</p><hr>`;
});

document.getElementById("history").innerHTML=output;
}
</script>

</body>
</html>
