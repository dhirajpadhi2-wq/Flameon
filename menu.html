<!DOCTYPE html>
<html>
<head>
<title>Flame On Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial, sans-serif;
color:white;
padding-bottom:80px;
background: linear-gradient(-45deg, #111, #1a1a1a, #2b2b2b, #000);
background-size:400% 400%;
animation: gradientBG 10s ease infinite;
}


@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}



@keyframes glow{
from{box-shadow:0 0 10px #ff3c00;}
to{box-shadow:0 0 25px #ff7300;}
}

.top-bar{
text-align:center;
background:#000;
padding:10px;
}

.top-bar a{
color:#ff3c00;
text-decoration:none;
}

.search-box{
padding:10px;
text-align:center;
background:#1a1a1a;
}

.search-box input{
width:80%;
padding:8px;
}

.category{
margin-top:25px;
padding:0 15px;
}

.category h2{
border-bottom:2px solid #ff3c00;
padding-bottom:5px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #333;
transition:0.3s;
}

.item:hover{
background:#222;
transform:scale(1.02);
}

.qty{
display:flex;
gap:5px;
align-items:center;
}

button{
background:#ff3c00;
color:white;
border:none;
padding:5px 10px;
cursor:pointer;
}

#cart{
position:fixed;
bottom:0;
width:100%;
background:black;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}
  .navbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#ff3c00;
padding:12px 20px;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:20px;
font-weight:bold;
}

.nav-links a{
color:white;
text-decoration:none;
margin-left:15px;
font-size:14px;
}

.nav-links a:hover{
text-decoration:underline;
}
  @media(max-width:768px){
.nav-links a{
margin-left:8px;
font-size:12px;
}
.logo{
font-size:16px;
}
  }
</style>
</head>

<body>

<header class="navbar">
  <div class="logo">🔥 Flame On</div>

  <div class="nav-links">
    <a href="menu.html">🏠 Home</a>
    <a href="menu.html">🍔 Menu</a>
    <a href="catering.html">🍽 Catering</a>
    <a href="#tracking">📦 Track Order</a>
  </div>
</header>
  


<div class="top-bar">
📞 <a href="tel:+919090820969">+91 90908 20969</a> |
<a href="tel:+919090691003">+91 9090691003</a>
</div>

  
<div class="search-box">
<div id="tracking" style="text-align:center; padding:15px; background:#000;">
<h3>Track Your Order</h3>
<input type="text" id="trackInput" placeholder="Enter Order ID">
<button onclick="trackOrder()">Track</button>
<div id="trackingStatus" style="margin-top:10px;"></div>
  </div>
<input type="text" id="search" placeholder="Search food..." onkeyup="renderMenu()">
</div>

<div id="menu"></div>

<div id="cart">
<div>Total: ₹<span id="total">0</span></div>
<button onclick="sendWhatsApp()">Order Now</button>
</div>

<script>

let cart = {};

function trackOrder(){
let orderID = document.getElementById("trackInput").value;
let statusDiv = document.getElementById("trackingStatus");

if(!orderID){
statusDiv.innerHTML = "⚠️ Please enter Order ID";
return;
}

let stages = [
"🟡 Order Placed",
"🔵 Preparing Your Food",
"🟣 Out For Delivery",
"🟢 Delivered"
];

let randomStage = Math.floor(Math.random()*stages.length);
statusDiv.innerHTML = "<b>Status:</b> " + stages[randomStage];
}

function renderMenu(){

const searchInput = document.getElementById("search");
const search = searchInput ? searchInput.value.toLowerCase() : "";

const menuDiv = document.getElementById("menu");
menuDiv.innerHTML = "";

menu.forEach(section=>{

const filteredItems = section.items.filter(item =>
item.name.toLowerCase().includes(search)
);

if(filteredItems.length===0) return;

const categoryDiv = document.createElement("div");
categoryDiv.className = "category";

const heading = document.createElement("h2");
heading.innerHTML = "🍽️ " + section.category;
categoryDiv.appendChild(heading);

filteredItems.forEach(item=>{

if(!cart[item.name]) cart[item.name]=0;

const itemDiv=document.createElement("div");
itemDiv.className="item";

const minusBtn = document.createElement("button");
minusBtn.innerText = "-";
minusBtn.onclick = function(){ changeQty(item.name,-1); };

const plusBtn = document.createElement("button");
plusBtn.innerText = "+";
plusBtn.onclick = function(){ changeQty(item.name,1); };

const qtySpan = document.createElement("span");
qtySpan.innerText = cart[item.name];

const qtyDiv = document.createElement("div");
qtyDiv.className="qty";
qtyDiv.appendChild(minusBtn);
qtyDiv.appendChild(qtySpan);
qtyDiv.appendChild(plusBtn);

const nameSpan = document.createElement("span");
nameSpan.innerText = item.name + " - ₹" + item.price;

itemDiv.appendChild(nameSpan);
itemDiv.appendChild(qtyDiv);

categoryDiv.appendChild(itemDiv);
});

menuDiv.appendChild(categoryDiv);

});

updateTotal();
}

function changeQty(name,change){
if(!cart[name]) cart[name]=0;
cart[name]+=change;
if(cart[name]<0) cart[name]=0;
renderMenu();
}

function findPrice(name){
for(let section of menu){
for(let item of section.items){
if(item.name===name){
return item.price;
}
}
}
return 0;
}

function updateTotal(){
let total=0;
for(let item in cart){
total += cart[item] * findPrice(item);
}
document.getElementById("total").innerText = total;
}

function sendWhatsApp(){

let total = document.getElementById("total").innerText;

if(total == 0){
alert("Please add items first!");
return;
}

let orderID = "FO" + Math.floor(Math.random()*10000);

let message="🔥 Flame On Restaurant%0A";
message+="Order ID: "+orderID+"%0A%0A";

for(let item in cart){
if(cart[item] > 0){
message+="• "+item+" x"+cart[item]+"%0A";
}
}

message+="%0ATotal: ₹"+total;
message+="%0AThank You!";

window.open("https://wa.me/919090820969?text="+message);

cart = {};
renderMenu();
}

document.addEventListener("DOMContentLoaded", function () {
renderMenu();
});

</script>
