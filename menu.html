<!DOCTYPE html>
<html>
<head>
<title>Menu - Flame On</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family:Arial;
background:#111;
color:white;
margin:0;
}
h1{
text-align:center;
padding:20px;
}
.category{
background:#ff3c00;
padding:10px;
margin-top:30px;
text-align:center;
font-weight:bold;
}
.food-card{
background:#222;
margin:15px;
padding:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
}
button{
padding:6px 12px;
background:#ff3c00;
color:white;
border:none;
cursor:pointer;
}
.cart-box{
background:#000;
padding:15px;
margin:15px;
border-radius:10px;
}
</style>
</head>
<body>

<h1>🔥 Our Full Menu</h1>

<div id="menu"></div>

<h2 style="text-align:center;">🛒 Cart</h2>
<div id="cart" class="cart-box"></div>
<h3 id="total" style="text-align:center;"></h3>

<div style="text-align:center; margin-bottom:30px;">
<button onclick="sendWhatsApp()">Order on WhatsApp</button>
</div>

<script>

let cart = [];

const menuData = [

/* BIRYANI */
{category:"Biryani", name:"Special Chicken Biryani", price:150},
{category:"Biryani", name:"Chicken Biryani (Half)", price:120},
{category:"Biryani", name:"Mutton Biryani", price:250},
{category:"Biryani", name:"Egg Biryani", price:100},
{category:"Biryani", name:"Veg Biryani", price:100},

/* STARTERS */
{category:"Starters", name:"Chicken Lollipop", price:120},
{category:"Starters", name:"Chicken 65", price:140},
{category:"Starters", name:"Paneer Pakoda", price:100},
{category:"Starters", name:"French Fries", price:60},

/* BURGER */
{category:"Burger", name:"Veg Burger", price:70},
{category:"Burger", name:"Chicken Burger", price:90},

/* MOMO */
{category:"Momo", name:"Veg Momo", price:50},
{category:"Momo", name:"Chicken Momo", price:60},

/* CHINESE */
{category:"Chinese", name:"Veg Fried Rice", price:80},
{category:"Chinese", name:"Chicken Fried Rice", price:100},
{category:"Chinese", name:"Chilly Chicken", price:120},

/* INDIAN CURRY */
{category:"Indian Curry", name:"Butter Chicken", price:200},
{category:"Indian Curry", name:"Paneer Butter Masala", price:150},
{category:"Indian Curry", name:"Mutton Curry", price:250},

/* ROTI */
{category:"Roti & Naan", name:"Roti", price:10},
{category:"Roti & Naan", name:"Butter Naan", price:25},

/* BEVERAGES */
{category:"Beverages", name:"Cold Coffee", price:70},
{category:"Beverages", name:"Chocolate Shake", price:80}

];

const menuContainer = document.getElementById("menu");

const categories = [...new Set(menuData.map(item => item.category))];

categories.forEach(category => {

const title = document.createElement("div");
title.className = "category";
title.innerText = category;
menuContainer.appendChild(title);

menuData
.filter(item => item.category === category)
.forEach(item => {

const card = document.createElement("div");
card.className = "food-card";

card.innerHTML = `
<div>
<strong>${item.name}</strong><br>
₹${item.price}
</div>
<button onclick="addToCart('${item.name}', ${item.price})">
Add
</button>
`;

menuContainer.appendChild(card);

});

});

function addToCart(name, price){
cart.push({name, price});
renderCart();
}

function renderCart(){
let cartDiv = document.getElementById("cart");
cartDiv.innerHTML = "";
let total = 0;

cart.forEach((item,index)=>{
total += item.price;
cartDiv.innerHTML += `
<div style="display:flex;justify-content:space-between;margin:5px 0;">
${item.name} - ₹${item.price}
<button onclick="removeItem(${index})">❌</button>
</div>
`;
});

document.getElementById("total").innerText = "Total: ₹" + total;
}

function removeItem(index){
cart.splice(index,1);
renderCart();
}

function sendWhatsApp(){
let message = "🔥 Flame On Order:%0A";
let total = 0;

cart.forEach(item=>{
message += item.name + " - ₹" + item.price + "%0A";
total += item.price;
});

message += "%0ATotal: ₹" + total;

window.open("https://wa.me/919090820969?text=" + message);
}

</script>

</body>
</html>
