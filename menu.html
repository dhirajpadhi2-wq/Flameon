<!DOCTYPE html>
<html>
<head>
<title>Flame On Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family:Arial;
margin:0;
background:#111;
color:white;
}
h2{
background:#ff3c00;
padding:10px;
}
.menu-item{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #333;
}
button{
background:#ff3c00;
color:white;
border:none;
padding:5px 10px;
cursor:pointer;
}
#cart{
position:fixed;
bottom:0;
width:100%;
background:black;
padding:10px;
}
</style>
</head>
<body>

<h1 style="text-align:center;">🔥 Flame On Menu</h1>

<div id="menu"></div>

<div id="cart">
Total: ₹<span id="total">0</span>
<button onclick="sendWhatsApp()">Order on WhatsApp</button>
</div>

<script>

const menu = [
{category:"STARTERS - VEG", items:[
{name:"CRISPY CORN", price:120},
{name:"CRISPY CHILLY BABYCORN", price:150},
{name:"PANEER PAKODA", price:100},
{name:"FRENCH FRIES", price:60}
]},
{category:"BURGER", items:[
{name:"VEG PATTY BURGER", price:70},
{name:"CRISPY CHICKEN BURGER", price:80}
]},
{category:"MOMO", items:[
{name:"VEG MOMO", price:50},
{name:"NON-VEG MOMO", price:60}
]}
];

let cart=[];
let total=0;

const menuDiv=document.getElementById("menu");

menu.forEach(section=>{
let h=document.createElement("h2");
h.innerText=section.category;
menuDiv.appendChild(h);

section.items.forEach(item=>{
let div=document.createElement("div");
div.className="menu-item";
div.innerHTML=`
<span>${item.name} - ₹${item.price}</span>
<button onclick="addToCart('${item.name}',${item.price})">Add</button>
`;
menuDiv.appendChild(div);
});
});

function addToCart(name,price){
cart.push({name,price});
total+=price;
document.getElementById("total").innerText=total;
}

function sendWhatsApp(){
let message="Order Details:%0A";
cart.forEach(item=>{
message+=item.name+" - ₹"+item.price+"%0A";
});
message+="Total: ₹"+total;
window.open("https://wa.me/919090820969?text="+message);
}

</script>

</body>
</html>
