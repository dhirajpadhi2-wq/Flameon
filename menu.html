
<!DOCTYPE html>
<html>
<head>
<title>Menu - Flame On</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#111;color:white;text-align:center}
.card{background:#222;margin:20px;padding:20px;border-radius:10px}
button{padding:8px 15px;background:#ff3c00;color:white;border:none}
</style>
</head>
<body>

<h1>Our Menu</h1>

<div class="card">
<h3>Chicken Biryani</h3>
<p>₹180</p>
<button onclick="addToCart('Chicken Biryani',180)">Add to Cart</button>
</div>

<div class="card">
<h3>Butter Chicken</h3>
<p>₹200</p>
<button onclick="addToCart('Butter Chicken',200)">Add to Cart</button>
</div>

<script>
function addToCart(name,price){
let cart=JSON.parse(localStorage.getItem('cart'))||[];
cart.push({name,price});
localStorage.setItem('cart',JSON.stringify(cart));
alert("Added to cart");
}
</script>

</body>
</html>
