<!DOCTYPE html>
<html>
<head>
<title>Flame On - Full Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#111;color:white;margin:0}
h1{text-align:center;padding:20px}
.category{background:#ff3c00;padding:10px;margin-top:25px;text-align:center;font-weight:bold}
.food{background:#222;margin:10px;padding:15px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
button{background:#ff3c00;border:none;color:white;padding:5px 10px;margin:2px}
.cart-box{background:#000;margin:15px;padding:15px;border-radius:10px}
.qty-box{display:flex;align-items:center}
.qty-box button{padding:3px 8px}
</style>
</head>
<body>

<h1>🔥 Flame On Full Menu</h1>
<div id="menu"></div>

<h2 style="text-align:center;">🛒 Cart</h2>
<div id="cart" class="cart-box"></div>
<h3 id="total" style="text-align:center;"></h3>

<div style="text-align:center;margin-bottom:30px;">
<button onclick="sendWhatsApp()">Order on WhatsApp</button>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const menuData = [
{cat:"Biryani",name:"Chicken Biryani",price:180},
{cat:"Biryani",name:"Mutton Biryani",price:250},
{cat:"Biryani",name:"Egg Biryani",price:100},
{cat:"Biryani",name:"Veg Biryani",price:100},

{cat:"Starters",name:"Chicken Lollipop",price:120},
{cat:"Starters",name:"Chicken 65",price:140},
{cat:"Starters",name:"Paneer Pakoda",price:100},
{cat:"Starters",name:"French Fries",price:60},

{cat:"Burger",name:"Veg Burger",price:70},
{cat:"Burger",name:"Chicken Burger",price:90},

{cat:"Momo",name:"Veg Momo",price:50},
{cat:"Momo",name:"Chicken Momo",price:60},

{cat:"Chinese",name:"Veg Fried Rice",price:80},
{cat:"Chinese",name:"Chicken Fried Rice",price:100},
{cat:"Chinese",name:"Chilly Chicken",price:120},

{cat:"Indian Curry",name:"Butter Chicken",price:200},
{cat:"Indian Curry",name:"Paneer Butter Masala",price:150},
{cat:"Indian Curry",name:"Mutton Curry",price:250},

{cat:"Roti & Naan",name:"Roti",price:10},
{cat:"Roti & Naan",name:"Butter Naan",price:25},
{cat:"Roti & Naan",name:"Garlic Naan",price:30},

{cat:"Beverages",name:"Cold Coffee",price:70},
{cat:"Beverages",name:"Chocolate Shake",price:80}
];

const menuDiv=document.getElementById("menu");
const categories=[...new Set(menuData.map(i=>i.cat))];

categories.forEach(c=>{
let title=document.createElement("div");
title.className="category";
title.innerText=c;
menuDiv.appendChild(title);

menuData.filter(i=>i.cat===c).forEach(item=>{
let food=document.createElement("div");
food.className="food";
food.innerHTML=`
<div>${item.name}<br>₹${item.price}</div>
<button onclick="addToCart('${item.name}',${item.price})">Add</button>
`;
menuDiv.appendChild(food);
});
});

function addToCart(name,price){
let existing=cart.find(i=>i.name===name);
if(existing){
existing.qty+=1;
}else{
cart.push({name,price,qty:1});
}
saveCart();
renderCart();
}

function renderCart(){
let cartDiv=document.getElementById("cart");
cartDiv.innerHTML="";
let total=0;

cart.forEach((item,index)=>{
total+=item.price*item.qty;
cartDiv.innerHTML+=`
<div style="margin:8px 0;">
${item.name} - ₹${item.price} x ${item.qty}
<div class="qty-box">
<button onclick="decrease(${index})">-</button>
<button onclick="increase(${index})">+</button>
<button onclick="removeItem(${index})">❌</button>
</div>
</div>
`;
});

document.getElementById("total").innerText="Total: ₹"+total;
}

function increase(i){
cart[i].qty+=1;
saveCart();
renderCart();
}

function decrease(i){
if(cart[i].qty>1){
cart[i].qty-=1;
}else{
cart.splice(i,1);
}
saveCart();
renderCart();
}

function removeItem(i){
cart.splice(i,1);
saveCart();
renderCart();
}

function saveCart(){
localStorage.setItem("cart",JSON.stringify(cart));
}

function sendWhatsApp(){
let message="🔥 Flame On Order:%0A";
let total=0;

cart.forEach(item=>{
message+=item.name+" x "+item.qty+" = ₹"+(item.price*item.qty)+"%0A";
total+=item.price*item.qty;
});

message+="%0ATotal: ₹"+total;
window.open("https://wa.me/919090820969?text="+message);
}

renderCart();

</script>

</body>
</html>
