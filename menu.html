<!DOCTYPE html>
<html>
<head>
<title>Flame On Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family:Arial;
margin:0;
background:#111;
color:white;
}
h2{
background:#ff3c00;
padding:10px;
}
.menu-item{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #333;
}
button{
background:#ff3c00;
color:white;
border:none;
padding:5px 10px;
cursor:pointer;
}
#cart{
position:fixed;
bottom:0;
width:100%;
background:black;
padding:10px;
}
</style>
</head>
<body>

<h1 style="text-align:center;">🔥 Flame On Menu</h1>

<div id="menu"></div>

<div id="cart">
Total: ₹<span id="total">0</span>
<button onclick="sendWhatsApp()">Order on WhatsApp</button>
</div>
<script>

const menu = [
{
category:"STARTERS - VEG",
items:[
{name:"CRISPY CORN", price:120},
{name:"FRENCH FRIES", price:60},
{name:"CHEESE BALLS", price:80}
]
},
{
category:"BURGER",
items:[
{name:"VEG BURGER", price:70},
{name:"CHICKEN BURGER", price:80}
]
}
];

let total = 0;
let cartItems = [];

const menuDiv = document.getElementById("menu");

menu.forEach(section => {

const heading = document.createElement("h2");
heading.innerText = section.category;
menuDiv.appendChild(heading);

section.items.forEach(item => {

const div = document.createElement("div");
div.className = "menu-item";

div.innerHTML = `
<span>${item.name} - ₹${item.price}</span>
<button onclick="addToCart('${item.name}', ${item.price})">Add</button>
`;

menuDiv.appendChild(div);

});

});

function addToCart(name, price){
total += price;
cartItems.push(name);
document.getElementById("total").innerText = total;
}

function sendWhatsApp(){
let message = "Order Details:%0A";
cartItems.forEach(item=>{
message += item + "%0A";
});
message += "Total: ₹" + total;

window.open("https://wa.me/919090820969?text=" + message);
}

</script>
