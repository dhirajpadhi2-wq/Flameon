let savedFoods = JSON.parse(localStorage.getItem("foods")) || [];
let cart = {};

function trackOrder(){
let orderID = document.getElementById("trackInput").value;
let statusDiv = document.getElementById("trackingStatus");

if(!orderID){
statusDiv.innerHTML = "⚠️ Please enter Order ID";
return;
}

let stages = [
"🟡 Order Placed",
"🔵 Preparing Your Food",
"🟣 Out For Delivery",
"🟢 Delivered"
];

let randomStage = Math.floor(Math.random()*stages.length);
statusDiv.innerHTML = "<b>Status:</b> " + stages[randomStage];
}

function renderMenu(){
const search = document.getElementById("search").value.toLowerCase();
const menuDiv = document.getElementById("menu");
menuDiv.innerHTML = "";

menu.forEach(section=>{

const filteredItems = section.items.filter(item =>
item.name.toLowerCase().includes(search)
);

if(filteredItems.length===0) return;

const categoryDiv = document.createElement("div");
categoryDiv.className = "category";

const heading = document.createElement("h2");
let icon="🍽️";

if(section.category.includes("VEG")) icon="🥦";
if(section.category.includes("NON VEG")) icon="🍗";
if(section.category.includes("BIRYANI")) icon="🍛";
if(section.category.includes("BURGER")) icon="🍔";
if(section.category.includes("PIZZA")) icon="🍕";
if(section.category.includes("MOMO")) icon="🥟";
if(section.category.includes("NOODLES")) icon="🍜";
if(section.category.includes("SOUP")) icon="🍲";
if(section.category.includes("BEVERAGES")) icon="🥤";
if(section.category.includes("RICE")) icon="🍚";
if(section.category.includes("DAL")) icon="🥘";

heading.innerHTML = icon + " " + section.category;
categoryDiv.appendChild(heading);

filteredItems.forEach(item=>{

if(!cart[item.name]) cart[item.name]=0;

const itemDiv=document.createElement("div");
itemDiv.className="item";

itemDiv.innerHTML=`
<span>${item.name} - ₹${item.price}</span>
<div class="qty">
<button onclick="changeQty('${item.name}',-1)">-</button>
<span>${cart[item.name]}</span>
<button onclick="changeQty('${item.name}',1)">+</button>
</div>
`;

categoryDiv.appendChild(itemDiv);
});

menuDiv.appendChild(categoryDiv);

});

updateTotal();
}

function changeQty(name,change){
if(!cart[name]) cart[name]=0;

cart[name]+=change;

if(cart[name]<0) cart[name]=0;

renderMenu();
}

function findPrice(name){
for(let section of menu){
for(let item of section.items){
if(item.name===name){
return item.price;
}
}
}
return 0;
}

function updateTotal(){
let total=0;

for(let item in cart){
total += cart[item] * findPrice(item);
}

document.getElementById("total").innerText = total;
}

renderMenu();
