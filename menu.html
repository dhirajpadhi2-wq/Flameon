<!DOCTYPE html>
<html>
<head>
<title>Flame On Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#111;
color:white;
}

header{
background:#ff3c00;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.top-bar{
text-align:center;
background:#000;
padding:10px;
}

.top-bar a{
color:#ff3c00;
text-decoration:none;
}

.search-box{
padding:10px;
text-align:center;
background:#1a1a1a;
}

.search-box input{
width:80%;
padding:8px;
}

.category{
margin-top:25px;
padding:0 15px;
}

.category h2{
border-bottom:2px solid #ff3c00;
padding-bottom:5px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #333;
}

.qty{
display:flex;
gap:5px;
align-items:center;
}

button{
background:#ff3c00;
color:white;
border:none;
padding:5px 10px;
cursor:pointer;
}

#cart{
position:fixed;
bottom:0;
width:100%;
background:black;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}
</style>
</head>

<body>

<header>🔥 Flame On Restaurant</header>

<div class="top-bar">
📞 <a href="tel:+919090820969">+91 90908 20969</a> |
<a href="tel:+919090691003">+91 9090691003</a>
</div>

<div class="search-box">
<input type="text" id="search" placeholder="Search food..." onkeyup="renderMenu()">
</div>

<div id="menu"></div>

<div id="cart">
<div>Total: ₹<span id="total">0</span></div>
<button onclick="sendWhatsApp()">Order Now</button>
</div>

<script>

const menu = [
{
category:"STARTERS",
items:[
{name:"Crispy Corn",price:120},
{name:"Paneer Pakoda",price:100},
{name:"Chicken Lollipop",price:120},
{name:"Chicken 65",price:140}
]
},
{
category:"BIRYANI",
items:[
{name:"Special Chicken Biryani",price:150},
{name:"Mutton Biryani",price:250},
{name:"Veg Biryani",price:100}
]
},
{
category:"BURGERS",
items:[
{name:"Veg Patty Burger",price:70},
{name:"Chicken Patty Burger",price:80}
]
}
];

let cart={};

function renderMenu(){
const search=document.getElementById("search").value.toLowerCase();
const menuDiv=document.getElementById("menu");
menuDiv.innerHTML="";

menu.forEach(section=>{

const filteredItems=section.items.filter(item =>
item.name.toLowerCase().includes(search)
);

if(filteredItems.length===0) return;

const categoryDiv=document.createElement("div");
categoryDiv.className="category";

const heading=document.createElement("h2");
heading.innerText=section.category;
categoryDiv.appendChild(heading);

filteredItems.forEach(item=>{

if(!cart[item.name]) cart[item.name]=0;

const itemDiv=document.createElement("div");
itemDiv.className="item";

itemDiv.innerHTML=`
<span>${item.name} - ₹${item.price}</span>
<div class="qty">
<button onclick="changeQty('${item.name}',${item.price},-1)">-</button>
<span>${cart[item.name]}</span>
<button onclick="changeQty('${item.name}',${item.price},1)">+</button>
</div>
`;

categoryDiv.appendChild(itemDiv);
});

menuDiv.appendChild(categoryDiv);

});
}

function changeQty(name,price,change){
cart[name]+=change;
if(cart[name]<0) cart[name]=0;
renderMenu();
calculateTotal();
}

function calculateTotal(){
let total=0;
for(let item in cart){
const price=findPrice(item);
total+=price*cart[item];
}
document.getElementById("total").innerText=total;
}

function findPrice(name){
for(let section of menu){
for(let item of section.items){
if(item.name===name) return item.price;
}
}
return 0;
}

function sendWhatsApp(){
let total=document.getElementById("total").innerText;

if(total==0){
alert("Please add items first!");
return;
}

let message="🔥 Flame On Restaurant Order:%0A%0A";

for(let item in cart){
if(cart[item]>0){
message+="• "+item+" x"+cart[item]+"%0A";
}
}

message+="%0ATotal: ₹"+total;

window.open("https://wa.me/919090820969?text="+message);
}

renderMenu();

</script>

</body>
</html>
